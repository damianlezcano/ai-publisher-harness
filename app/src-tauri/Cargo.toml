[package]
name = "educai"
version = "0.1.0"
description = "EducAI desktop application"
edition = "2021"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

# Standalone workspace root so this Tauri crate is not pulled into the parent
# Rust workspace (whose `cargo test --workspace` must remain webkit-free).
[workspace]

[lib]
name = "educai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
project-app = { path = "../../crates/project-app" }
project-provider = { path = "../../crates/project-provider" }
