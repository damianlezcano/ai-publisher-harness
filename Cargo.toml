[workspace]
members = [
    "crates/fake-opencode-server",
    "crates/project-agent",
    "crates/project-app",
    "crates/project-core",
    "crates/project-fs",
    "crates/project-knowledge",
    "crates/project-opencode",
    "crates/project-provider",
    "crates/project-preview",
    "crates/project-publisher",
    "crates/project-publication",
    "crates/project-process",
    "crates/project-tunnel",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
getrandom = "0.4"
unicode-normalization = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
ndarray = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
nix = { version = "0.29", features = ["signal", "process"] }
